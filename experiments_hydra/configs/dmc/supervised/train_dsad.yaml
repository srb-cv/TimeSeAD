# @package _global_
dataset:
  name: DMCDataset
  ds_args:
    training: true
    task_id: [1]
    use_normal_only: false
  pipeline:
    prediction:
      class: timesead.models.supervised.DSADTargetTransform
      args:
        window_size: 3
        replace_labels: false #does not matter 
  test_pipeline:
    prediction:
      class: timesead.models.supervised.DSADTargetTransform
      args:
        window_size: 3
        replace_labels: false #does not matter
  use_dataset_pipeline: false
  split: [0.75, 0.25]
  split_axis: time

training:
  optimizer:
    class: torch.optim.Adam
    args: {}
  batch_size: 128
  batch_dim: 0
  num_workers: 0
  drop_last: false
  scheduler:
    class: torch.optim.lr_scheduler.MultiStepLR
    args:
      milestones: [20]
      gamma: 0.1
  epochs: 70
  device: cuda
  loss: DSADLoss
  trainer: timesead.optim.trainer.Trainer
  trainer_hooks:
    - event: post_validation
      hook: timesead.optim.trainer.EarlyStoppingHook
  checkpoint_interval: 15
  deterministic: false
  seed: 0
  supervised: true

model:
  hidden_dims: 100,50
  act: ReLU
  attn: self_attn
  bias: true
  stride: 1
  n_heads: 8
  d_model: 512
  pos_encoding: fixed
  norm: LayerNorm
  epoch_steps: -1
  prt_steps: 10
  verbose: 2
  random_state: 42

experiment:
  name: exathlon.prediction.train_lstm_prediction_filonov
  family: prediction
  entrypoint: experiments_hydra.prediction.train_lstm_prediction_filonov
  mlflow_experiment_name: TimeSeAD-Hydra
  tracking_uri: null
  train_detector: true
  tags:
    pilot: "true"

sweep:
  selection_metric: best_ts_f1_score
  validation_metric: best_ts_f1_score
  evaluation_metrics:
    - best_ts_f1_score
    - ts_auprc
    - best_ts_f1_score_classic
    - ts_auprc_unweighted
    - best_f1_score
    - auprc
  mode: max
  training_param_updates:
    dataset:
      name: DMCDataset
    training:
      epochs: 100
  training_param_grid:
    model:
      lstm_hidden_dims:
        - [30, 20]
        - [50, 30]
        - [50, 30, 20]
        - [50, 50, 50]
      linear_hidden_layers:
        - []
        - [40]
        - [30, 30]
        - [30, 30, 30]
      dropout:
        - 0.0
        - 0.15
        - 0.2
    dataset:
      pipeline:
        prediction:
          args:
            window_size:
              - 10
              - 50
              - 75
              - 100
    training:
      optimizer:
        args:
          lr:
            - 1.0e-4
            - 1.0e-3
            - 1.0e-2
