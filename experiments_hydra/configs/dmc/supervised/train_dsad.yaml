# @package _global_
dataset:
  name: DMCDataset
  ds_args:
    training: true
    task_id: [1]
    use_unsupervised_training: false
    use_anomalous_as_normal: false
    shuffle_train_files: true # needed for supervised training to ensure that the model does not see all normal samples before anomalous ones
    shuffle_test_files: true
    shuffle_seed: 0
  pipeline:
    prediction:
      class: timesead.models.supervised.DSADTargetTransform
      args:
        window_size: 32
        replace_labels: false #does not matter 
  test_pipeline:
    prediction:
      class: timesead.models.supervised.DSADTargetTransform
      args:
        window_size: 32
        replace_labels: false #does not matter
  use_dataset_pipeline: false
  split: [0.75, 0.25]
  split_axis: batch

training:
  optimizer:
    class: torch.optim.Adam
    args: {}
  batch_size: 32
  batch_dim: 0
  num_workers: 0
  drop_last: false
  scheduler:
    class: torch.optim.lr_scheduler.MultiStepLR
    args:
      milestones: [20]
      gamma: 0.1
  epochs: 70
  device: cpu
  loss: DSADLoss
  trainer: timesead.optim.trainer.Trainer
  trainer_hooks:
    - event: post_validation
      hook: timesead.optim.trainer.EarlyStoppingHook
  checkpoint_interval: 15
  deterministic: false
  seed: 0
  supervised: true

model:
  hidden_dims: 200,100
  act: ReLU
  attn: self_attn
  bias: true
  stride: 1
  n_heads: 8
  d_model: 512
  pos_encoding: fixed
  norm: LayerNorm
  epoch_steps: -1
  prt_steps: 10
  verbose: 2
  random_state: 42

experiment:
  name: dmc.supervised.train_dsad
  family: supervised
  entrypoint: experiments_hydra.supervised.train_dsad
  mlflow_experiment_name: TimeSeAD-Hydra
  tracking_uri: null
  train_detector: true
  evaluate_after_training: true
  post_train_evaluation:
    protocol: holdout_calibration # or single_split/ holdout_calibration
    split: [0.3, 0.7]
    tune_split_index: 0
    eval_split_index: 1
    threshold_metric: ${sweep.validation_metric}
    fit_detector_on: saved_artifact
    metric_names: ${sweep.evaluation_metrics}
  tags:
    pilot: "true"

sweep:
  selection_metric: best_ts_f1_score
  validation_metric: best_ts_f1_score
  evaluation_metrics:
    - best_ts_f1_score
    - ts_auprc
    - best_ts_f1_score_classic
    - ts_auprc_unweighted
    - best_f1_score
    - auprc
  mode: max
  training_param_updates:
    dataset:
      name: DMCDataset
    training:
      epochs: 100
  training_param_grid:
    model:
      hidden_dims:
        - 100,50
        - 50
      d_model:
        - 128
        - 512
    dataset:
      pipeline:
        prediction:
          args:
            window_size:
              - 10
              - 50
              - 75
              - 100
    training:
      optimizer:
        args:
          lr:
            - 1.0e-4
            - 1.0e-3
            - 1.0e-2
