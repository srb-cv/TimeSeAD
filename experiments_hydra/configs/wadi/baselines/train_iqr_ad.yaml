# @package _global_
dataset:
  name: WADIDataset
  ds_args:
    training: true
  pipeline: {}
  test_pipeline:
    window:
      class: WindowTransform
      args:
        window_size: 32
  use_dataset_pipeline: true
  split: [0.0, 1.0]
  split_axis: time

training:
  batch_size: 128
  batch_dim: 0
  num_workers: 0
  drop_last: false
  device: cpu
  seed: 0

detector:
  std_factor: 2.58
  first_diffs: true
  cum_method: mean
  feature_index: null
  input_shape: btf

experiment:
  name: wadi.baselines.train_iqr_ad
  family: baseline
  entrypoint: experiments_hydra.baselines.train_iqr_ad
  mlflow_experiment_name: TimeSeAD-Hydra
  tracking_uri: null
  train_detector: true
  evaluate_after_training: false
  tags:
    pilot: "true"

sweep:
  selection_metric: best_ts_f1_score
  validation_metric: best_ts_f1_score
  evaluation_metrics:
    - best_ts_f1_score
    - ts_auprc
    - best_ts_f1_score_classic
    - ts_auprc_unweighted
    - best_f1_score
    - auprc
  mode: max
  training_param_updates:
    dataset:
      name: WADIDataset
    training:
      epochs: 1
  detector_param_grid:
    detector:
